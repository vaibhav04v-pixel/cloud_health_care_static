version: "3.8"

services:
  mongo:
    image: mongo
    ports: 
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: qwrty

  mongo-express:
    image: mongo-express
    depends_on:
      - mongo
    ports: 
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: qwrty
      ME_CONFIG_MONGODB_URL: mongodb://admin:qwrty@mongo:27017/ 