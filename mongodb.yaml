version: "3.8"

services:
  mongo:
    image: mongo
    ports: 
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: qwrty

  mongo-express:
    image: mongo-express
    depends_on:
      - mongo
    ports: 
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: qwrty
      ME_CONFIG_MONGODB_URL: mongodb://admin:qwrty@mongo:27017/ 

  cloudapp:
    image: cloudapp:1.0
    container_name: cloudapp
    restart: always
    ports:
      - "3000:3000"
    # environment:
    #   MONGO_DB_USERNAME: admin
    #   MONGO_DB_PWD: qwrty
    depends_on:
      - mongo